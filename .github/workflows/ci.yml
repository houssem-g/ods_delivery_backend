name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ods_delivery
          POSTGRES_USER: ods_delivery
          POSTGRES_PASSWORD: ods_delivery_local
        ports: ["5451:5432"]
        options: >-
          --health-cmd "pg_isready -U ods_delivery -d ods_delivery"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ods_delivery:ods_delivery_local@localhost:5451/ods_delivery_test
      PGPASSWORD: ods_delivery_local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Start MinIO
        # Official minio images are no longer published; pgsty/minio is the community build.
        run: |
          docker run -d --name minio -p 9110:9000 \
            -e MINIO_ROOT_USER=odsdlv-local -e MINIO_ROOT_PASSWORD=odsdlv-local-secret \
            pgsty/minio:latest server /data
      - name: Test database and extensions
        run: |
          psql -h localhost -p 5451 -U ods_delivery -d ods_delivery -c "CREATE DATABASE ods_delivery_test"
          for db in ods_delivery ods_delivery_test; do
            psql -h localhost -p 5451 -U ods_delivery -d $db \
              -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS postgis;
                  CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          done
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Dependency audit (report only)
        continue-on-error: true
        run: make audit
      - name: Migrations (single head, up, down, up, no drift)
        env:
          DATABASE_URL: postgresql+asyncpg://ods_delivery:ods_delivery_local@localhost:5451/ods_delivery
        run: |
          uv run python scripts/check_single_head.py
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Wait for MinIO
        run: timeout 60 sh -c 'until curl -fsS http://localhost:9110/minio/health/live; do sleep 2; done'
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (whole history, .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 \
            git /repo --no-banner --redact --config /repo/.gitleaks.toml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ods-delivery-api:ci
          build-args: APP_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (read-only, no capabilities, non-root)
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' ods-delivery-api:ci)" = "app"
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e SCHEDULER_ENABLED=false -e REALTIME_ENABLED=false \
            -e LOG_FORMAT=json ods-delivery-api:ci
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:8000/api/health; do sleep 2; done'
          curl -fsS -D - -o /dev/null -H 'X-Request-ID: ci-smoke-0001' http://127.0.0.1:8000/api/health \
            | grep -i '^x-request-id: ci-smoke-0001'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/metrics)" = "404"
          docker logs api
          docker rm -f api
      - name: Vulnerability scan (report only)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ods-delivery-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
