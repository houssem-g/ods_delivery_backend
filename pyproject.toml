[project]
name = "ods-delivery-backend"
version = "0.1.0"
description = "ODS Delivery API (replaces Base44)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
    "pydantic-settings>=2.4",
    "pydantic>=2.8",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 reads bcrypt.__about__ (removed in 4.1)
    "pyjwt>=2.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "firebase-admin>=6.5",
    "apscheduler>=3.10,<4",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "aiosmtplib>=3.0",
    "phonenumbers>=8.13",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "asgi-lifespan>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
# SQLAlchemy's asyncio layer runs on greenlets; without this, code after a switch looks unrun.
concurrency = ["greenlet", "thread"]
omit = ["app/migrations/*"]
